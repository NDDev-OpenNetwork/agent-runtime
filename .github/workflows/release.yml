# SPDX-License-Identifier: AGPL-3.0-only

# A tag is the release. The Go module proxy serves the library the moment the
# tag is pushed, so this workflow only adds what the proxy does not: built
# binaries of the CLI, with checksums, attached to the GitHub Release.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Build the CLI for every supported platform
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="agent-runtime_${VERSION}_${os}_${arch}"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -o "dist/${name}/agent-runtime" ./cmd/agent-runtime
            tar -C "dist/${name}" -czf "dist/${name}.tar.gz" agent-runtime
            rm -rf "dist/${name}"
          done
          cd dist && sha256sum ./*.tar.gz > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" --generate-notes ./dist/*.tar.gz ./dist/SHA256SUMS
